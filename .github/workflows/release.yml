# Cuts a release by hand: Actions → Release → Run workflow, or
#   gh workflow run release.yml -f bump=minor
#
# 1. prepare (Linux): bumps the version (scripts/release-version.mjs),
#    commits "Release vX.Y.Z" to main and tags it.
# 2. macos, linux: bundle the tag in parallel, IdeDB.app and a .dmg on
#    macOS, a .deb, an .rpm and an AppImage on Linux, and upload them as
#    workflow artifacts. `platforms` leaves one of them out.
# 3. publish (Linux): puts every bundle in one GitHub Release.
#
# A dry run commits, tags and publishes nothing: it bundles the branch it
# runs on (any branch) at the would-be version and keeps the bundles as
# workflow artifacts.
#
# Code signing and notarization turn on by themselves once the APPLE_*
# secrets exist; until then the app is ad-hoc signed and not notarized.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      platforms:
        description: Platforms to bundle
        type: choice
        options: [all, macos, linux]
        default: all
      target:
        description: "macOS: aarch64 (Apple Silicon) or universal (adds Intel, takes longer)"
        type: choice
        options: [aarch64, universal]
        default: aarch64
      draft:
        description: Publish the GitHub Release as a draft
        type: boolean
        default: true
      dry_run:
        description: Only build; upload the bundles as workflow artifacts without committing, tagging or releasing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      # A dry run pushes nothing, so it may try a branch before it merges.
      - name: Only from main
        if: github.ref != 'refs/heads/main' && !inputs.dry_run
        run: |
          echo "::error::Releases are cut from main; this run is on ${GITHUB_REF}. Dry runs work from any branch."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release-version.mjs "$BUMP"
      - name: Refuse an existing tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "IdeDB v${VERSION}"
          git push origin HEAD:refs/heads/main
          git push origin "v${VERSION}"
      - name: Ref to build
        id: ref
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Bundle (macOS)
    needs: prepare
    if: inputs.platforms != 'linux'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      ad_hoc_signed: ${{ steps.signature.outputs.ad_hoc_signed }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RUST_TARGET: ${{ inputs.target == 'universal' && 'universal-apple-darwin' || 'aarch64-apple-darwin' }}
      ARCH_LABEL: ${{ inputs.target == 'universal' && 'universal' || 'aarch64' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A dry run builds the branch as it is, so apply the would-be version locally.
      - name: Apply version (dry run)
        if: ${{ inputs.dry_run }}
        run: node scripts/release-version.mjs "$VERSION"
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_TARGET }}

      # Only non-empty values are exported: an empty APPLE_* variable would
      # make the bundler try to sign or notarize with it.
      - name: Configure code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::No APPLE_CERTIFICATE secret: building an ad-hoc signed, unnotarized app"
            exit 0
          fi
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required when APPLE_CERTIFICATE is set"
              exit 1
            fi
          done
          notarize=0
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] && notarize=$((notarize + 1))
          done
          if [ "$notarize" -ne 0 ] && [ "$notarize" -ne 3 ]; then
            echo "::error::Notarization needs all of APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID"
            exit 1
          fi
          [ "$notarize" -eq 0 ] && echo "::warning::Signing without notarization (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID not set)"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__IDEDB_EOF__"; echo "${!name}"; echo "__IDEDB_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build
        run: pnpm tauri build --target "$RUST_TARGET" --bundles app,dmg

      # The publish job warns about the quarantine flag only for an ad-hoc
      # signed app, so ask the bundle that ships rather than the settings.
      - name: Check signature
        id: signature
        run: |
          app="target/${RUST_TARGET}/release/bundle/macos/IdeDB.app"
          if codesign -dv "$app" 2>&1 | grep -qx "Signature=adhoc"; then
            echo "ad_hoc_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ad_hoc_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        run: |
          bundle="target/${RUST_TARGET}/release/bundle"
          mkdir -p dist-release
          cp "$bundle"/dmg/*.dmg "dist-release/IdeDB_${VERSION}_${ARCH_LABEL}.dmg"
          tar -czf "dist-release/IdeDB_${VERSION}_${ARCH_LABEL}.app.tar.gz" -C "$bundle/macos" IdeDB.app
          ls -lh dist-release

      # A dry run keeps the bundles for a week; a release only needs them
      # until the publish job picks them up.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: IdeDB_${{ env.VERSION }}_macos_${{ env.ARCH_LABEL }}
          path: dist-release/*
          retention-days: ${{ inputs.dry_run && 7 || 1 }}

  linux:
    name: Bundle (Linux)
    needs: prepare
    if: inputs.platforms != 'macos'
    # An AppImage only runs where glibc is at least as new as on the machine
    # that built it, so build on the oldest supported runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      # The same list as ci.yml.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A dry run builds the branch as it is, so apply the would-be version locally.
      - name: Apply version (dry run)
        if: ${{ inputs.dry_run }}
        run: node scripts/release-version.mjs "$VERSION"
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # tauri.conf.json lists the macOS bundles, so name the Linux ones.
      - name: Build
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        run: |
          bundle="target/release/bundle"
          mkdir -p dist-release
          cp "$bundle"/deb/*.deb "dist-release/IdeDB_${VERSION}_amd64.deb"
          cp "$bundle"/rpm/*.rpm "dist-release/IdeDB_${VERSION}_x86_64.rpm"
          cp "$bundle"/appimage/*.AppImage "dist-release/IdeDB_${VERSION}_amd64.AppImage"
          ls -lh dist-release

      # A dry run keeps the bundles for a week; a release only needs them
      # until the publish job picks them up.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: IdeDB_${{ env.VERSION }}_linux_x86_64
          path: dist-release/*
          retention-days: ${{ inputs.dry_run && 7 || 1 }}

  publish:
    name: Publish
    needs: [prepare, macos, linux]
    # A skipped build job skips this one too unless the condition checks
    # results itself: each platform must have built, or been left out by
    # `platforms`. A failed or cancelled build stops the release.
    if: >-
      !cancelled() && !inputs.dry_run
      && needs.prepare.result == 'success'
      && (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && inputs.platforms == 'linux'))
      && (needs.linux.result == 'success' || (needs.linux.result == 'skipped' && inputs.platforms == 'macos'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: IdeDB_*
          path: dist-release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          MACOS_AD_HOC_SIGNED: ${{ needs.macos.outputs.ad_hoc_signed }}
        run: |
          ls -lh dist-release
          tag="v${VERSION}"
          {
            if [ "$MACOS_AD_HOC_SIGNED" = "true" ]; then
              echo "> **Unsigned macOS build.** macOS will refuse to open it until you remove the quarantine flag:"
              echo "> \`xattr -dr com.apple.quarantine /Applications/IdeDB.app\`"
              echo
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body
          } > release-notes.md
          draft_flag=()
          [ "$DRAFT" = "true" ] && draft_flag=(--draft)
          gh release create "$tag" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IdeDB ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${draft_flag[@]}"
