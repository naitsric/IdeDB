[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
idedb-core = { path = "crates/idedb-core" }
idedb-driver-mysql = { path = "crates/idedb-driver-mysql" }
idedb-driver-pg = { path = "crates/idedb-driver-pg" }
idedb-driver-sqlite = { path = "crates/idedb-driver-sqlite" }
idedb-drivers = { path = "crates/idedb-drivers" }
idedb-sql = { path = "crates/idedb-sql" }
idedb-store = { path = "crates/idedb-store" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
rmp-serde = "1.3"
rusqlite = { version = "0.40", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to a minor: its AST changes between minors. The default features
# keep `recursive-protection`, which matters when parsing untrusted SQL.
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = "1"

# Profiles only take effect at the workspace root.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
