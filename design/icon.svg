<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    IdeDB app icon. macOS grid: 824×824 body at (100,100), corner radius 185.
    A database with a text caret: a SQL IDE. Rendered by scripts/render-icon.mjs.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8bff"/>
      <stop offset="1" stop-color="#2141c2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe4ff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3d2ff"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="barrel-clip">
      <path d="M252 318 V686 A218 76 0 0 0 688 686 V318 Z"/>
    </clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1a4a" flood-opacity="0.32"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1a4a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Database: three stacked discs. -->
  <g filter="url(#lift)">
    <path d="M252 318 V686 A218 76 0 0 0 688 686 V318 Z" fill="url(#barrel)"/>
    <ellipse cx="470" cy="318" rx="218" ry="76" fill="#ffffff"/>
  </g>
  <ellipse cx="470" cy="318" rx="160" ry="44" fill="#e3eaff"/>
  <g clip-path="url(#barrel-clip)" fill="none" stroke="#3558e0" stroke-width="20" stroke-opacity="0.9">
    <path d="M232 441 A238 83 0 0 0 708 441"/>
    <path d="M232 564 A238 83 0 0 0 708 564"/>
  </g>

  <!-- Text caret: the IDE. -->
  <g filter="url(#lift)">
    <rect x="730" y="470" width="52" height="300" rx="26" fill="url(#caret)"/>
  </g>
</svg>
