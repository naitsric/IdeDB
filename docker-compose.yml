# Local databases for development and driver integration tests.
# Ports are offset to avoid clashing with databases already on the host.
name: idedb
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: idedb
      POSTGRES_PASSWORD: idedb
      POSTGRES_DB: idedb
    volumes:
      - ./dev/seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idedb"]
      interval: 2s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: idedb
      MYSQL_USER: idedb
      MYSQL_PASSWORD: idedb
      MYSQL_DATABASE: idedb
    volumes:
      - ./dev/seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "33069:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uidedb -pidedb --silent"]
      interval: 2s
      retries: 30
