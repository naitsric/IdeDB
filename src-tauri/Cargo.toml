[package]
name = "idedb"
description = "SQL client with DataGrip-grade UX"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "idedb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
idedb-core.workspace = true
idedb-drivers.workspace = true
idedb-store.workspace = true
rmp-serde.workspace = true
serde.workspace = true
# macos-private-api: transparent window for the translucent sidebar (not
# Mac App Store compatible; IdeDB ships through GitHub releases).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
